    <title>Snatchy — Understand your lift</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Resolve the theme before first paint. Without this the page renders
      // dark and then repaints, which is visible on reload. Keep the key in
      // sync with THEME_KEY in src/services/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('snatchy-theme-v1');
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
